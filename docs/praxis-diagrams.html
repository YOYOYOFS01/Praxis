<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praxis — System Architecture &amp; Workflow Diagrams</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 40px 24px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 56px;
    }

    /* ── Tab nav ── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .tab-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #888;
      padding: 8px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }

    .tab-btn:hover { border-color: #444; color: #ccc; }

    .tab-btn.active {
      background: #1e1e1e;
      border-color: #555;
      color: #fff;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Diagram container ── */
    .diagram-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    svg {
      overflow: visible;
    }

    /* ── Node styles ── */
    .node rect, .node ellipse {
      stroke-width: 1.5;
    }

    /* colour palette matching screenshots */
    .col-white  { fill: #0d0d0d; stroke: #cccccc; }
    .col-orange { fill: #0d0d0d; stroke: #c8763a; }
    .col-pink   { fill: #0d0d0d; stroke: #c84b8a; }
    .col-green  { fill: #0d0d0d; stroke: #3a7a4e; }
    .col-red    { fill: #0d0d0d; stroke: #a03030; }
    .col-teal   { fill: #0d0d0d; stroke: #2a8080; }
    .col-purple { fill: #111020; stroke: #7a5aaa; }
    .col-blue   { fill: #0d0d0d; stroke: #3a5a9a; }

    .node text {
      fill: #e0e0e0;
      font-size: 13px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    /* ── Arrows ── */
    .arrow {
      fill: none;
      stroke: #444;
      stroke-width: 1.4;
      marker-end: url(#arrowhead);
    }

    .arrow-dashed {
      fill: none;
      stroke: #444;
      stroke-width: 1.4;
      stroke-dasharray: 5 4;
      marker-end: url(#arrowhead-dashed);
    }

    /* ── Sequence diagram ── */
    .lifeline {
      stroke: #333;
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
    }

    .actor rect  { fill: #111; }
    .actor text  { font-size: 12px; fill: #ddd; dominant-baseline: middle; text-anchor: middle; }

    .msg-line {
      stroke: #555;
      stroke-width: 1.3;
      marker-end: url(#seq-arrow);
    }

    .msg-label {
      fill: #aaa;
      font-size: 11px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      dominant-baseline: middle;
    }

    /* ── Diagram title ── */
    .diagram-title {
      text-align: center;
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }
  </style>
</head>
<body>

<h1>Praxis — M2M Payment Architecture</h1>
<p class="subtitle">System architecture, request flow, and detailed component diagram</p>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('arch1')">Architecture Overview</button>
  <button class="tab-btn"        onclick="showTab('seq')">Sequence Flow</button>
  <button class="tab-btn"        onclick="showTab('arch2')">Detailed Architecture</button>
</div>

<!-- ═══════════════════════════════════════════════════
     TAB 1 — Architecture Overview
════════════════════════════════════════════════════ -->
<div id="arch1" class="tab-panel active">

      <!-- User -->
      <g class="node">

        <text x="380" y="41">User</text>

      <!-- Next.js Dashboard -->
      <g class="node">

      <!-- Next.js API Routes -->
      <g class="node">

      </g>

      <!-- Mastra Workflow -->
      <g class="node">
        <rect x="220" y="294" width="160" height="42" rx="4" class="col-green"/>

      </g>

      <!-- Vendor API -->
      <g class="node">
        <rect x="20" y="390" width="130" height="42" rx="4" class="col-orange"/>

      </g>

      <!-- Budget + Policy Guards -->
      <g class="node">
        <rect x="175" y="390" width="170" height="42" rx="4" class="col-green"/>
        <text x="260" y="411">Budget + Policy Guards</text>
      </g>

      <!-- Proof Builder -->
      <g class="node">
        <rect x="366" y="390" width="130" height="42" rx="4" class="col-red"/>
        <text x="431" y="411">Proof Builder</text>
      </g>

      <!-- Payment Firewall + x402 -->
      <g class="node">
        <rect x="516" y="390" width="190" height="42" rx="4" class="col-teal"/>
        <text x="611" y="411">Payment Firewall + x402</text>
      </g>

      <!-- Database -->
      <g class="node">
        <ellipse cx="540" cy="510" rx="68" ry="28" class="col-purple"/>

      </g>

      <!-- Base Sepolia -->
      <g class="node">
        <rect x="644" y="490" width="110" height="42" rx="4" class="col-orange"/>
        <text x="699" y="511">Base Sepolia</text>
      </g>

      <!-- ── Arrows ── -->
      <!-- User → Dashboard -->
      <line x1="380" y1="62" x2="380" y2="106" class="arrow" marker-end="url(#arrowhead)"/>
      <!-- Dashboard → API Routes -->
      <line x1="380" y1="150" x2="380" y2="194" class="arrow" marker-end="url(#arrowhead)"/>
      <!-- API Routes → Mastra Workflow -->
      <path d="M 340 238 Q 300 266 300 292" class="arrow" marker-end="url(#arrowhead)"/>
      <!-- API Routes → Payment Firewall -->
      <path d="M 430 238 Q 550 266 580 292 Q 611 320 611 388" class="arrow" marker-end="url(#arrowhead)"/>

      <!-- Mastra → Vendor API -->
      <path d="M 240 336 Q 150 360 85 388" class="arrow" marker-end="url(#arrowhead)"/>
      <!-- Mastra → Budget+Policy -->
      <path d="M 265 336 Q 263 362 262 388" class="arrow" marker-end="url(#arrowhead)"/>
      <!-- Mastra → Proof Builder -->
      <path d="M 335 336 Q 385 362 430 388" class="arrow" marker-end="url(#arrowhead)"/>
      <!-- Mastra → Payment Firewall -->
      <path d="M 360 336 Q 490 350 516 388" class="arrow" marker-end="url(#arrowhead)"/>

      <!-- Payment Firewall → Database -->
      <path d="M 580 432 Q 565 460 555 480" class="arrow" marker-end="url(#arrowhead)"/>
      <!-- Payment Firewall → Base Sepolia -->
      <path d="M 658 432 Q 675 460 693 488" class="arrow" marker-end="url(#arrowhead)"/>

      <!-- API Routes → Database (feedback) -->
      <path d="M 475 217 Q 640 217 700 300 Q 740 380 620 490" class="arrow" marker-end="url(#arrowhead)" stroke="#333"/>
    </svg>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════
     TAB 2 — Sequence Diagram
════════════════════════════════════════════════════ -->
<div id="seq" class="tab-panel">
  <p class="diagram-title">Request Sequence — Purchase Flow</p>
  <div class="diagram-wrap">
    <svg width="860" height="780" viewBox="0 0 860 780">
      <defs>
        <marker id="seq-arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 7 3, 0 6" fill="#666" />
        </marker>
        <marker id="seq-arrow-dashed" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 7 3, 0 6" fill="#555" />
        </marker>
      </defs>

      <!-- Actor column centres: Dashboard=90, API=240, DB=390, Mastra=565, Payment=730 -->

      <!-- ── Actor boxes (top) ── -->
      <g class="actor">
        <rect x="20"  y="16" width="140" height="44" rx="4" fill="#111" stroke="#555" stroke-width="1.5"/>
        <text x="90"  y="38" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">Dashboard</text>
      </g>
      <g class="actor">
        <rect x="170" y="16" width="140" height="44" rx="4" fill="#111" stroke="#c84b8a" stroke-width="1.5"/>
        <text x="240" y="38" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">API Route</text>
      </g>
      <g class="actor">
        <rect x="318" y="16" width="144" height="44" rx="4" fill="#111" stroke="#c8763a" stroke-width="1.5"/>
        <text x="390" y="38" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">SQLite DB</text>
      </g>
      <g class="actor">
        <rect x="494" y="16" width="142" height="44" rx="4" fill="#111" stroke="#3a7a4e" stroke-width="1.5"/>
        <text x="565" y="38" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">Mastra Workflow</text>
      </g>
      <g class="actor">
        <rect x="658" y="16" width="152" height="44" rx="4" fill="#111" stroke="#2a8080" stroke-width="1.5"/>
        <text x="734" y="38" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">Payment Layer</text>
      </g>

      <!-- ── Lifelines ── -->
      <line x1="90"  y1="60" x2="90"  y2="740" class="lifeline"/>
      <line x1="240" y1="60" x2="240" y2="740" class="lifeline"/>
      <line x1="390" y1="60" x2="390" y2="740" class="lifeline"/>
      <line x1="565" y1="60" x2="565" y2="740" class="lifeline"/>
      <line x1="734" y1="60" x2="734" y2="740" class="lifeline"/>

      <!-- ── Messages ── -->

      <!-- 1. POST /api/purchase -->
      <line x1="92"  y1="100" x2="238" y2="100" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="165" y="94" class="msg-label" text-anchor="middle">POST /api/purchase</text>

      <!-- 2. createRun(prompt) -->
      <line x1="242" y1="138" x2="388" y2="138" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="132" class="msg-label" text-anchor="middle">createRun(prompt)</text>

      <!-- 3. start purchaseWorkflow(runId, prompt) -->
      <line x1="242" y1="176" x2="563" y2="176" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="402" y="170" class="msg-label" text-anchor="middle">start purchaseWorkflow(runId, prompt)</text>

      <!-- 4. event intent_parsed -->
      <line x1="563" y1="214" x2="243" y2="214" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="402" y="208" class="msg-label" text-anchor="middle">event intent_parsed</text>

      <!-- 5. save intentJson -->
      <line x1="242" y1="248" x2="392" y2="248" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="242" class="msg-label" text-anchor="middle">save intentJson</text>

      <!-- 6. event vendor_quote_received -->
      <line x1="563" y1="284" x2="243" y2="284" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="402" y="278" class="msg-label" text-anchor="middle">event vendor_quote_received</text>

      <!-- 7. save quoteJson -->
      <line x1="242" y1="318" x2="392" y2="318" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="312" class="msg-label" text-anchor="middle">save quoteJson</text>

      <!-- 8. event budget_check_passed -->
      <line x1="563" y1="354" x2="243" y2="354" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="402" y="348" class="msg-label" text-anchor="middle">event budget_check_passed</text>

      <!-- 9. save budgetJson -->
      <line x1="242" y1="388" x2="392" y2="388" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="382" class="msg-label" text-anchor="middle">save budgetJson</text>

      <!-- 10. event policy_check_passed -->
      <line x1="563" y1="424" x2="243" y2="424" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="402" y="418" class="msg-label" text-anchor="middle">event policy_check_passed</text>

      <!-- 11. save policyJson -->
      <line x1="242" y1="458" x2="392" y2="458" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="452" class="msg-label" text-anchor="middle">save policyJson</text>

      <!-- 12. event proof_generated -->
      <line x1="563" y1="494" x2="243" y2="494" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="402" y="488" class="msg-label" text-anchor="middle">event proof_generated</text>

      <!-- 13. save proofJson + proofHash -->
      <line x1="242" y1="528" x2="392" y2="528" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="522" class="msg-label" text-anchor="middle">save proofJson + proofHash</text>

      <!-- 14. execute payment -->
      <line x1="567" y1="562" x2="732" y2="562" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="650" y="556" class="msg-label" text-anchor="middle">execute payment</text>

      <!-- 15. event payment_settled -->
      <line x1="732" y1="596" x2="244" y2="596" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="490" y="590" class="msg-label" text-anchor="middle">event payment_settled</text>

      <!-- 16. save receiptJson -->
      <line x1="242" y1="630" x2="392" y2="630" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="624" class="msg-label" text-anchor="middle">save receiptJson</text>

      <!-- 17. getRun(runId) -->
      <line x1="242" y1="664" x2="392" y2="664" class="msg-line" marker-end="url(#seq-arrow)"/>
      <text x="315" y="658" class="msg-label" text-anchor="middle">getRun(runId)</text>

      <!-- 18. return full run (dashed) -->
      <line x1="238" y1="698" x2="94"  y2="698" stroke="#555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#seq-arrow-dashed)"/>
      <text x="165" y="692" class="msg-label" text-anchor="middle">return full run</text>

      <!-- ── Actor boxes (bottom) ── -->
      <g class="actor">
        <rect x="20"  y="726" width="140" height="44" rx="4" fill="#111" stroke="#555" stroke-width="1.5"/>
        <text x="90"  y="748" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">Dashboard</text>
      </g>
      <g class="actor">
        <rect x="170" y="726" width="140" height="44" rx="4" fill="#111" stroke="#c84b8a" stroke-width="1.5"/>
        <text x="240" y="748" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">API Route</text>
      </g>
      <g class="actor">
        <rect x="318" y="726" width="144" height="44" rx="4" fill="#111" stroke="#c8763a" stroke-width="1.5"/>
        <text x="390" y="748" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">SQLite DB</text>
      </g>
      <g class="actor">
        <rect x="494" y="726" width="142" height="44" rx="4" fill="#111" stroke="#3a7a4e" stroke-width="1.5"/>
        <text x="565" y="748" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">Mastra Workflow</text>
      </g>
      <g class="actor">
        <rect x="658" y="726" width="152" height="44" rx="4" fill="#111" stroke="#2a8080" stroke-width="1.5"/>
        <text x="734" y="748" fill="#cccccc" font-size="13" text-anchor="middle" dominant-baseline="middle">Payment Layer</text>
      </g>
    </svg>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════

════════════════════════════════════════════════════ -->

      <!-- All bottom nodes → DB -->

      <path d="M 96 418 Q 96 480 330 530" class="arrow" marker-end="url(#arrowhead2)" stroke="#333"/>
      <!-- Budget+Policy → DB -->
      <path d="M 279 418 Q 279 478 360 528" class="arrow" marker-end="url(#arrowhead2)" stroke="#333"/>
      <!-- Proof Builder → DB -->

      <!-- Base Sepolia → DB -->

      <path d="M 536 210 Q 760 210 790 400 Q 810 510 556 540" class="arrow" marker-end="url(#arrowhead2)" stroke="#2a2a2a"/>
    </svg>
  </div>
</div>

<script>
  function showTab(id) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  }
</script>
</body>
</html>
