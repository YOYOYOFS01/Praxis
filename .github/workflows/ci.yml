name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    env:
      # Safe mock values — no real keys needed for tsc + next build
      DATABASE_URL: "file:./dev.db"
      PAYMENT_MODE: "mock"
      CHAIN_MODE: "mock"
      MOCK_AGENTS: "true"
      HITL_THRESHOLD_USDC: "0"
      AGENT_MAX_PAYMENT_USDC: "50000"
      TENANT_DAILY_BUDGET_USD: "500000"
      NEXT_PUBLIC_PAYMENT_MODE: "mock"
      NEXT_PUBLIC_CHAIN_MODE: "mock"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript — type check
        run: npx tsc --noEmit

      - name: Next.js — build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint -- --max-warnings 0
